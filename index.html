<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>notdot</title><link data-trunk rel="rust" href="crates/notdot-orb/Cargo.toml"><link data-trunk rel="css" href="style.css"></head><body><canvas id="orb" aria-label="notdot orb. Click to speak, right-click for settings, Space to speak. Escape to stop." tabindex="0"></canvas><dialog id="panel"><form id="settings"><p class="eyebrow">YOUR COMPANION</p><h1 id="heading">Meet notdot</h1><label>Name<input id="name" maxlength="80" required></label><label>Orb colour<input id="hue" type="range" min="0" max="360"></label><label>Voice backend<select id="provider"><option value="elevenlabs">ElevenLabs</option></select></label><label>Voice backend API key<input id="key" type="password" autocomplete="off" placeholder="Stored in your OS keychain"></label><button type="button" id="load-voices">Load voices</button><div class="voice-field"><label id="voice-label">Voice</label><div class="voice-control"><button type="button" id="voice-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="voice-popup"><span id="voice-value">Choose a voice</span><span aria-hidden="true">⌄</span></button><button type="button" id="preview-voice" aria-label="Preview selected voice" title="Preview selected voice">▶</button></div><div id="voice-popup" hidden role="dialog" aria-labelledby="voice-label"><label id="voice-search-label" hidden>Search voices<input id="voice-search" type="search" autocomplete="off" placeholder="Search voices…"></label><div id="voice-results" aria-label="Available voices"></div><button type="button" id="more-voices" hidden>More voices</button></div><select id="voice" hidden aria-hidden="true" tabindex="-1"><option value="">Choose a voice</option></select></div><p id="voice-info" class="hint" role="status"></p><label class="switch-row"><span class="switch-copy">Remember notes<span class="switch-description">Only when I explicitly ask you to keep them</span></span><input id="memory" type="checkbox" role="switch" aria-label="Remember notes only when I explicitly ask you to keep them"><span class="switch-track" aria-hidden="true"></span></label><p class="hint">Click the orb to start or stop recording. Space also starts or stops recording. Escape cancels. Right-click opens settings. Drag to move.</p><p id="error" role="status"></p><section class="settings-tools" aria-labelledby="memory-tools-heading"><h2 id="memory-tools-heading">Memory</h2><div class="tool-actions"><button type="button" id="memories">Review memories</button><button type="button" id="maintain">Review &amp; compact</button></div><h2>Connection</h2><div class="tool-actions"><button type="button" id="retry">Reconnect agent</button><button type="button" id="clear-key" class="danger-action">Remove voice key</button></div></section><div class="actions settings-footer"><button type="button" id="close">Close</button><button type="submit" id="save-settings" class="primary-action">Save</button></div><section id="notes" aria-live="polite"></section></form></dialog></body></html>
