<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>notdot</title><link data-trunk rel="rust" href="crates/notdot-orb/Cargo.toml"><link data-trunk rel="css" href="style.css"></head><body><canvas id="orb" aria-label="notdot orb. Click to speak, right-click for settings, Space to speak. Escape to stop." tabindex="0"></canvas><dialog id="panel"><form id="settings"><p class="eyebrow">YOUR COMPANION</p><h1 id="heading">Meet notdot</h1><label>Name<input id="name" maxlength="80" required></label><label>Orb colour<input id="hue" type="range" min="0" max="360"></label><label>Voice backend<select id="provider"><option value="elevenlabs">ElevenLabs</option></select></label><label>Voice backend API key<input id="key" type="password" autocomplete="off" placeholder="Stored in your OS keychain"></label><button type="button" id="load-voices">Load voices</button><label id="voice-search-label" hidden>Search voices<input id="voice-search" type="search" autocomplete="off" placeholder="Name, accent or description"></label><label>Voice<select id="voice"><option value="">Choose a voice</option></select></label><p id="voice-info" class="hint" role="status"></p><div class="actions"><button type="button" id="more-voices" hidden>More voices</button><button type="button" id="preview-voice">Preview voice</button></div><label class="check"><input id="memory" type="checkbox"> Remember notes I explicitly ask you to keep</label><p class="hint">Click the orb to start or stop recording. Space also starts or stops recording. Escape cancels. Right-click opens settings. Drag to move.</p><p id="error" role="status"></p><div class="actions"><button type="button" id="close">Close</button><button type="submit" id="save-settings">Save</button></div><button type="button" id="memories">Review memories</button><button type="button" id="maintain">Review &amp; compact</button><button type="button" id="clear-key">Remove voice key</button><button type="button" id="retry">Reconnect agent</button><section id="notes" aria-live="polite"></section></form></dialog></body></html>
