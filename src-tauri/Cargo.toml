[package]
publish = false
name = "notdot"
version.workspace = true
edition.workspace = true
license.workspace = true
[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }
[dependencies]
notdot-core = { path = "../crates/notdot-core" }
notdot-speakers = { path = "../crates/notdot-speakers" }
notdot-voice = { path = "../crates/notdot-voice" }
notdot-wake-runtime = { path = "../crates/notdot-wake-runtime" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-autostart = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
sherpa-onnx = "=2.0.0"
sentencepiece-rs = "=0.2.2"
cpal = "=0.18.2"
hound = "3"
zeroize = "1"
# Already in the tree for TLS and voiceprints: AEAD and PBKDF2 for backups.
ring = "0.17"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
whisper-rs = { version = "=0.16.0", default-features = false }
rubato = { version = "=0.16.2", default-features = false }
# Native save/open panels for notes export and encrypted backups. GTK3 is the
# toolkit Tauri already links on Linux; no portal or Wayland client is added.
# 0.15 is the newest release linking the gtk-sys 0.18 used by Tauri (and the
# version tauri-plugin-dialog 2 wraps).
rfd = { version = "=0.15.4", default-features = false, features = ["gtk3"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
async-trait = "0.1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4.1"
gtk = "0.18"
