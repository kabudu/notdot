# Local reverse-proxy proof of concept for the notdot relay. Ports bind to
# loopback only. Not a production deployment; see README.md.
name: notdot-relay-poc
services:
  relay:
    image: n0computer/iroh-relay:v1.4.1
    command: ["--config-path", "/etc/iroh-relay/relay.toml"]
    volumes:
      - ./relay.toml:/etc/iroh-relay/relay.toml:ro
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [relay]
  proxy:
    image: nginx:1.29-alpine
    depends_on: [relay]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RELAY_CERT_DIR:?set RELAY_CERT_DIR to a folder with relay.crt and relay.key}:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    networks: [relay]
networks:
  relay: {}
