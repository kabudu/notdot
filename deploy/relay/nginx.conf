# Local proof of concept: nginx terminates TLS and forwards the relay's
# HTTP Upgrade (WebSocket) connection. On a shared host the same location
# block goes inside the existing proxy's server for the relay hostname.
worker_processes 1;
events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  upstream iroh_relay { server relay:3340; }
  server {
    listen 8443 ssl;
    server_name relay.localhost;
    ssl_certificate     /etc/nginx/certs/relay.crt;
    ssl_certificate_key /etc/nginx/certs/relay.key;
    location / {
      proxy_pass http://iroh_relay;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Relay connections are long-lived and mostly idle between turns.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }
  }
  # Negative control: the same proxy without Upgrade forwarding.
  server {
    listen 8444 ssl;
    server_name relay.localhost;
    ssl_certificate     /etc/nginx/certs/relay.crt;
    ssl_certificate_key /etc/nginx/certs/relay.key;
    location / {
      proxy_pass http://iroh_relay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
