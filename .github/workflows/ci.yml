name: Rust validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      force_full:
        description: Require all native checks, including for release preparation
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py classify
  content:
    name: Content checks
    needs: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py
      - run: python3 scripts/check_content_links.py
      - run: python3 scripts/distribution_notices.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/test_orb_input.mjs
      - run: node scripts/test_interrupt_lifecycle.mjs
      - name: Check committed whitespace
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          base, head = os.environ['CI_BASE'], os.environ['CI_HEAD']
          if all(re.fullmatch(r'[0-9a-f]{40}', value) and int(value, 16) for value in (base, head)):
              subprocess.run(['git', 'diff', '--check', f'{base}...{head}', '--'], check=True)
          else:
              subprocess.run(['git', 'diff', '--check'], check=True)
          PY
  release-tools:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Execute verified official prebuilt tools on this native host
        run: python scripts/install_release_tools.py
      - name: Verify real release command discovery
        run: python scripts/install_release_tools.py --verify-path
  windows-native:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.0
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Configure generic Windows app CPU floor
        shell: pwsh
        run: |
          @('GGML_NATIVE', 'GGML_SSE42', 'GGML_AVX', 'GGML_AVX2', 'GGML_FMA', 'GGML_F16C', 'GGML_BMI2', 'GGML_AVX_VNNI', 'GGML_AVX512', 'GGML_AVX512_VBMI', 'GGML_AVX512_VNNI', 'GGML_AVX512_BF16', 'GGML_AMX_TILE', 'GGML_AMX_INT8', 'GGML_AMX_BF16') | ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value "$_=OFF" }
          Add-Content -Path $env:GITHUB_ENV -Value 'CMAKE_GENERATOR=Ninja'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXXFLAGS=/EHsc'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-x86_64-pc-windows-msvc-generic-v1
          shared-key: build
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Repair pruned Sherpa native library cache
        run: python scripts/repair_sherpa_cache.py --target x86_64-pc-windows-msvc
      - name: Verify native archives before Cargo profiles
        run: python scripts/prepare_sherpa_archives.py --target x86_64-pc-windows-msvc --output "${{ runner.temp }}/notdot-sherpa-archives"
      # A cached debug rlib already embeds its native libraries. Compile a fresh
      # explicit-target release rlib too, matching the real packaging boundary.
      - name: Verify Windows release-mode static library binding
        run: cargo build -p sherpa-onnx-sys --release --target x86_64-pc-windows-msvc --locked
      - name: Prepare guarded Windows wake helper
        id: helper_build
        run: python scripts/build_windows_wake_helper.py
      - name: Rebuild generic native decoder with the selected generator
        run: cargo clean -p whisper-rs-sys
      - name: Test native Windows code and bundled models
        run: cargo test -p notdot-core -p notdot-voice -p notdot-wake-runtime -p notdot-speakers -p notdot-orb -p notdot --release --target x86_64-pc-windows-msvc --locked -- --test-threads=1
      - name: Check Windows-specific Rust code
        run: cargo clippy -p notdot-core -p notdot-voice -p notdot-wake-runtime -p notdot-speakers -p notdot --all-targets --locked -- -D warnings
      - name: Build isolated Windows input acceptance host
        run: cargo build -p notdot --example orb-input-acceptance --release --target x86_64-pc-windows-msvc --locked
      - name: Check isolated input host loads on Windows
        shell: pwsh
        run: |
          $env:NOTDOT_INPUT_TEST_URL = 'http://127.0.0.1:9'
          $log = Join-Path $env:RUNNER_TEMP 'input-host-startup.log'
          $process = Start-Process -FilePath 'target/x86_64-pc-windows-msvc/release/examples/orb-input-acceptance.exe' -PassThru -RedirectStandardError $log
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $output = Get-Content $log -Raw -ErrorAction SilentlyContinue
              $ready = $output -match 'geometry core=Ok'
            } while (-not $ready -and -not $process.HasExited -and (Get-Date) -lt $deadline)
            if (-not $ready) { throw "Input host did not create its native windows: $output" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
            Remove-Item Env:NOTDOT_INPUT_TEST_URL
          }
      - name: Retain isolated Windows input acceptance host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-input-acceptance
          path: target/x86_64-pc-windows-msvc/release/examples/orb-input-acceptance.exe
          if-no-files-found: error
          retention-days: 7
      - name: Install verified prebuilt release tools
        run: python scripts/install_release_tools.py
      - name: Verify packaging commands select the pinned tools
        run: python scripts/install_release_tools.py --verify-path
      # Build the actual installer without release secrets. Only this temporary
      # CI override disables updater signing; production release config is intact.
      - name: Build the unsigned Windows NSIS installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'notdot-unsigned-ci.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $config -Encoding utf8
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) { throw 'Expected one nonempty NSIS installer' }
          Get-FileHash $installers[0].FullName -Algorithm SHA256
      - name: Retain unsigned installer for native acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-test
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 2
      - name: Validate Windows toolset and redistribution records
        run: ./scripts/windows-release-provenance.ps1
      # Observe after acceptance, so the probe cannot prewarm the tested path.
      - name: Observe synthetic helper startup and response timing
        if: always() && steps.helper_build.outcome == 'success'
        run: python scripts/probe_windows_wake_helper.py
  windows-metadata:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_voice_fixtures.py
  macos:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: validation-${{ matrix.os }}-generic-v1
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Repair pruned Sherpa native library cache
        run: |
          NOTDOT_NATIVE_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$NOTDOT_NATIVE_TARGET"
          python3 scripts/repair_sherpa_cache.py --target "$NOTDOT_NATIVE_TARGET"
      - name: Verify native archives before Cargo profiles
        run: python3 scripts/prepare_sherpa_archives.py --output "${{ runner.temp }}/notdot-sherpa-archives"
      - name: Run complete local validation
        run: sh scripts/ci-local.sh
      # macOS ships the in-process decoder, not the Windows helper executable.
      # Exercise its real framing and unchanged decode deadline in release mode.
      - name: Exercise the production Mac wake decoder
        run: cargo test -p notdot --release wake::fallback::tests::production_framed_fallback_corpus_bypasses_keyword_spotting --locked -- --exact --nocapture --test-threads=1
  linux-native:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    env:
      GGML_NATIVE: "OFF"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.0
          components: clippy
      - name: Linux prerequisites
        run: |
          bash scripts/prepare_linux_apt.sh
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: validation-linux-x64-cpp-abi0-v1
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Repair pruned Sherpa native library cache
        run: python3 scripts/repair_sherpa_cache.py --target x86_64-unknown-linux-gnu
      - name: Verify native archives before Cargo profiles
        run: python3 scripts/prepare_sherpa_archives.py --target x86_64-unknown-linux-gnu --output "${{ runner.temp }}/notdot-sherpa-archives"
      # The pinned whisper-rs-sys build script does not track CXXFLAGS changes.
      # Rebuild this small native package so restored caches cannot mix string ABIs.
      - name: Rebuild the native C++ boundary
        run: cargo clean -p whisper-rs-sys
      - name: Test Linux code and the bundled wake models
        run: cargo test -p notdot-core -p notdot-voice -p notdot-wake-runtime -p notdot-speakers -p notdot-orb -p notdot --release --locked -- --test-threads=1
      - name: Check Linux-specific Rust code
        run: cargo clippy -p notdot-core -p notdot-voice -p notdot-wake-runtime -p notdot-speakers -p notdot --all-targets --locked -- -D warnings
      # Isolate one known accuracy case under the maintainer 0.1 Linux policy.
      # All other errors, including decode failures and native crashes, block.
      - name: Linux 48 kHz wake accuracy (advisory)
        id: linux_wake_48k
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .local
          set +e
          cargo test -p notdot --bin notdot --release --locked wake::tests::bundled_detector_accepts_48khz_wake_fixture -- --ignored --exact --nocapture 2>&1 | tee .local/linux-wake-48k.log
          statuses=("${PIPESTATUS[@]}")
          result="${statuses[0]}"
          if [ "${statuses[1]}" -ne 0 ]; then result=125; fi
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Enforce the narrow Linux wake-accuracy policy
        env:
          ADVISORY_EXIT_CODE: ${{ steps.linux_wake_48k.outputs.exit_code }}
          LINUX_WAKE_REPORT: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/validation/2026-10-29-linux.md
        run: python3 scripts/check_linux_wake_advisory.py .local/linux-wake-48k.log "$ADVISORY_EXIT_CODE"

  validation:
    name: validation
    if: always()
    needs: [changes, content, release-tools, windows-native, windows-metadata, macos, linux-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the selected validation path to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py gate
      - name: Record the successfully tested native inputs
        if: needs.changes.outputs.full == 'true'
        run: python3 scripts/ci_changes.py fingerprint > native-validation.txt
      - name: Retain native validation evidence for later copy-only commits
        if: needs.changes.outputs.full == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-validation-${{ needs.changes.outputs.native }}
          path: native-validation.txt
          retention-days: 30
          if-no-files-found: error
