name: Rust validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: validation-${{ matrix.os }}-generic-v1
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Run complete local validation
        run: sh scripts/ci-local.sh
      - name: Exercise the bundled wake model on this native Mac architecture
        run: cargo test -p notdot-wake-runtime --release --test lifecycle worker_reuses_one_model_process_and_matches_the_shared_engine --locked -- --ignored --exact --test-threads=1
