name: Rust validation
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test -p notdot-core -p notdot-voice --locked
      - run: cargo clippy -p notdot-core -p notdot-voice -p notdot --all-targets --locked -- -D warnings
      - run: cargo clippy -p notdot-orb --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy -p notdot-orb --target wasm32-unknown-unknown --features debug-ui --locked -- -D warnings
      - name: No production conversation UI
        run: python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'composer' not in s and '<textarea' not in s"
