name: Rust validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-metadata:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_voice_fixtures.py
  macos:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: validation-${{ matrix.os }}-generic-v1
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Run complete local validation
        run: sh scripts/ci-local.sh
      - name: Exercise the bundled wake model on this native Mac architecture
        run: cargo test -p notdot-wake-runtime --release --test lifecycle worker_reuses_one_model_process_and_matches_the_shared_engine --locked -- --ignored --exact --test-threads=1
  linux-native-diagnostic:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.0
      - name: Linux native diagnostic prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-x86_64-unknown-linux-gnu-generic-v1
          env-vars: GGML_ MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Rebuild the cached native library with the corrected ABI
        run: cargo clean -p whisper-rs-sys
      - name: Build Linux test executable
        run: |
          mkdir -p .local/linux-diagnostic
          cargo test -p notdot --bin notdot --locked --no-run --message-format=json > .local/linux-diagnostic/build.jsonl
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          artifacts = [json.loads(line) for line in Path('.local/linux-diagnostic/build.jsonl').read_text().splitlines()]
          binaries = [a['executable'] for a in artifacts if a.get('reason') == 'compiler-artifact' and a.get('target', {}).get('name') == 'notdot' and a.get('profile', {}).get('test') and a.get('executable')]
          assert len(binaries) == 1, binaries
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('NOTDOT_TEST_EXECUTABLE=' + binaries[0] + '\n')
          PYTHON
      - name: Run real Linux unit suite under GDB
        shell: bash
        run: |
          set -o pipefail
          gdb --batch --return-child-result -ex 'set pagination off' -ex 'set print thread-events off' -ex run -ex 'thread apply all bt 30' --args "$NOTDOT_TEST_EXECUTABLE" --nocapture 2>&1 | tee .local/linux-diagnostic/backtrace.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-native-diagnostic
          path: .local/linux-diagnostic
