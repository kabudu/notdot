[workspace]
members = ["crates/notdot-core", "crates/notdot-orb", "crates/notdot-voice", "src-tauri"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }

# LLVM 22 stripping can produce Mach-O proc-macro dylibs rejected by macOS 27.
# Keep LINKEDIT intact: https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"
