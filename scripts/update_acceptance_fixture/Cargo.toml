[package]
name = "notdot-update-acceptance-fixture"
version = "9.9.8"
edition = "2024"
license = "Apache-2.0"
publish = false
[workspace]
[dependencies]
notdot-core = { path = "../../crates/notdot-core" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "process"] }
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = "=2.5.4"
[build-dependencies]
tauri-build = "=2.7.4"
