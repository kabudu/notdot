[package]
name = "notdot-wake-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[features]
accelerated = []
# Temporary CI synthetic fixtures only; never enable in distributed binaries.
synthetic-diagnostics = []
[dependencies]
whisper-rs = { version = "=0.16.0", default-features = false }
rubato = { version = "=0.16.2", default-features = false }
sha2 = "0.10"
tokio.workspace = true
[[bin]]
name = "notdot-wake-helper"
path = "src/bin/helper.rs"

# Model-free OS-process fixture for integration tests, not a packaged helper.
[[bin]]
name = "notdot-wake-protocol-fixture"
path = "tests/support/protocol_helper.rs"
test = false
bench = false

[dev-dependencies]
hound = "3"
tempfile = "3"
