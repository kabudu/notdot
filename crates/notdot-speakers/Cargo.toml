[package]
publish = false
name = "notdot-speakers"
description = "On-device speaker recognition, guided enrolment and encrypted voiceprints for notdot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# Already used by src-tauri for wake/VAD; provides the speaker embedding extractor.
sherpa-onnx = "=2.0.0"
# Already in Cargo.lock through rustls: ChaCha20-Poly1305, SHA-256 and OS randomness.
ring = "0.17"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
hound = "3"
