[package]
publish = false
name = "notdot-link"
description = "Paired-device link: QR pairing, typed versioned protocol and encrypted transport between notdot desktop and phones"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.3"
base64 = "0.22"
thiserror = "2"
n0-future = "0.3"
[features]
# Accept the self-signed certificate of iroh's local test relay. Tests only.
test-relay = ["iroh/test-utils"]
[[test]]
name = "transport"
required-features = ["test-relay"]
[dev-dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
