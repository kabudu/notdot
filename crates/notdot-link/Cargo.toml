[package]
publish = false
name = "notdot-link"
description = "Paired-device link: QR pairing, typed versioned protocol and encrypted transport between notdot desktop and phones"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.3"
base64 = "0.22"
thiserror = "2"
rustls-pki-types = "1"
ring = "0.17"
[features]
# Accept the self-signed certificate of iroh's local test relay. Tests only.
test-relay = ["iroh/test-utils"]
# Synthetic attestation roots for tests. Never enable in a shipped build.
test-attestation = []
[[example]]
name = "desktop_sim"
required-features = ["test-relay"]
[[test]]
name = "transport"
required-features = ["test-relay"]
[[test]]
name = "reverse_proxy"
[dev-dependencies]
iroh-relay = { version = "1.4", default-features = false, features = ["server"] }
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
