[package]
publish = false
name = "notdot-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "notdot's own host-control drivers: an isolated browser over a private CDP pipe and the platform accessibility APIs."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
